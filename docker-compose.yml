services:
  # MongoDB — default service (docker compose up -d)
  mongo:
    image: mongo:7
    container_name: traderverse-mongo
    restart: unless-stopped
    ports:
      # 27017 is normally taken by the native MongoDB Windows service on this
      # machine, so publish the container on host port 27018.
      - "27018:27017"
    volumes:
      - mongo_data:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.adminCommand('ping').ok"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  # The subscription service itself (optional — starts only with --profile app)
  # Local dev: run the app on the host with `bun run dev` instead.
  app:
    profiles: ["app"]
    build: .
    container_name: traderverse-subscription-app
    restart: unless-stopped
    ports:
      - "3000:3000"
    env_file:
      - .env
    environment:
      # Inside docker the app must reach mongo via the service name, not localhost.
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DATABASE: shaheer-subscribtion-test
      PORT: 3000
    depends_on:
      mongo:
        condition: service_healthy

volumes:
  mongo_data:
